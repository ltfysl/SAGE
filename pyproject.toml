[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sage"
version = "0.1.0"
description = "SAGE: State-Aware Generative Engine — compile language into verified state transitions"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
  {name = "SAGE Research"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "pydantic>=2.0",
  "typer>=0.9",
  "rich>=13.0",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "datasets>=2.14",
  "transformers>=4.34",
  "torch>=2.1",
  "numpy>=1.24",
]

[project.optional-dependencies]
gpu = ["accelerate>=0.24"]
demo = ["streamlit>=1.27"]
viz = ["matplotlib>=3.7"]

[project.scripts]
sage = "sage.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sage = ["py.typed"]
